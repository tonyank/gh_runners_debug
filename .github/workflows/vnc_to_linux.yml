name: Browser VNC (No Ngrok)
on: workflow_dispatch # 手动触发

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装桌面环境和 VNC/noVNC
        run: |
          sudo apt update
          # 安装轻量级桌面 (XFCE4) 和用于网页转换 VNC 的 noVNC/websockify
          sudo apt install -y xfce4 xfce4-goodies tightvncserver novnc websockify

      - name: 2. 初始化并启动 VNC 服务
        run: |
          # 设置 VNC 默认密码为 password
          mkdir -p ~/.vnc
          echo "password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          # 启动 VNC 桌面在 :1 端口 (即物理端口 5901)
          vncserver :1 -geometry 1280x800 -depth 24

      - name: 3. 启动 noVNC 代理 (将 VNC 包装为 HTTP 网页)
        run: |
          # 用 websockify 将 6080 端口映射到 VNC 的 5901
          websockify --web=/usr/share/novnc 6080 localhost:5901 &

      - name: 4. 使用免费的 localtunnel 暴露网页链接 (免 Ngrok)
        run: |
          # 动态安装 localtunnel 客户端
          npm install -g localtunnel
          
          echo "============================================="
          echo "⚡️ 正在生成您的浏览器直连 URL... ⚡️"
          echo "提示：打开网页后输入密码 'password' 即可进入桌面。"
          echo "============================================="
          
          # 将本地 6080 端口暴露到公网，并保持运行
          lt --port 6080
