name: RDP to Windows

on:
  workflow_dispatch:
    inputs:
      WINDOWS_VERSION:
        type: choice
        description: 'Choose Windows version'
        options:
          # windows server 2022, default value
          - windows-2022
          # windows server 2025
          - windows-2025
          # windows 11 arm
          - windows-11-arm
          # windows latest
          - windows-latest
          
jobs:
  Build:
    runs-on: ${{ github.event.inputs.WINDOWS_VERSION }}
    timeout-minutes: 9999
    steps:
      - name: Deploy Ngrok
        shell: bash
        run: |
          curl -L -o ngrok.zip https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip
          unzip -q ngrok.zip

      - name: Add rclone config file
        shell: pwsh
        run: echo '${{ secrets.RCLONE_CONF }}' > ./rclone.conf

      - name: Enable TS(Terminal Service)
        shell: powershell
        run: |
          # 1. 开启远程桌面并放行防火墙
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Type DWord
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 2. 关闭 NLA 与降级安全层（同时写入组策略路径防止被覆盖）
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Type DWord
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Type DWord
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "UserAuthentication" -Value 0 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "SecurityLayer" -Value 1 -Type DWord

           # 3. 【关键】禁用 AVC/H.264 硬件编码，解决 Mac/iOS 客户端连接无显卡虚拟机报 0x4 的问题
           Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "AVC444ModePreferred" -Value 0 -Type DWord
           Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "AVCHardwareEncodePreferred" -Value 0 -Type DWord

           # 4. 重置密码并确保在管理员组
           Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
           Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue

           # 5. 【关键】重启远程桌面服务使上述所有修改立即生效
           Restart-Service -Name "TermService" -Force

      - name: Change Theme to Dark
        shell: cmd
        run: |
          Reg Query "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v SystemUsesLightTheme >nul 2>&1
          if %errorlevel% equ 0 (
            Reg Add "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v SystemUsesLightTheme /t REG_DWORD /d 0 /f
          )
          Reg Query "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v AppsUseLightTheme >nul 2>&1
          if %errorlevel% equ 0 (
            Reg Add "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v AppsUseLightTheme /t REG_DWORD /d 0 /f
          )

      - name: Forbid Hide Known File Extention
        shell: cmd
        run: Reg Add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f

      - name: 关闭“透明效果”。
        shell: cmd
        run: |
          reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency >nul 2>&1
          if %errorlevel% equ 0 (
            reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f
          )

      - name: 隐藏开始菜单栏的“搜索框”。
        shell: cmd
        run: Reg Add "HKCU\Software\Microsoft\Windows\CurrentVersion\Search" /v SearchboxTaskbarMode /t REG_DWORD /d 0 /f

      - name: 启用任务栏上的小图标。
        shell: cmd
        run: Reg Add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v TaskbarSmallIcons /t REG_DWORD /d 1 /f

      - name: 禁用任务栏上的 taskview 按钮。
        shell: cmd
        run: Reg Add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v ShowTaskViewButton /t REG_DWORD /d 0 /f

      - name: 重启 explorer 进程。
        shell: powershell
        run: |
          TASKKILL /F /IM explorer.exe /T
          SLEEP 5
          explorer.exe
          SLEEP 3

      - name: Authorize ngrok
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: .\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN

      - name: Deploy upload.bat
        shell: pwsh
        run: echo '${{ secrets.UPLOAD }}' > ./upload.bat

      # - name: Run ngrok in the background to create tunnel with tcp port 3
        # shell: powershell
        # run: Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"

      - name: Verify RDP listening
        shell: powershell
        run: |
          netstat -ano | findstr :3389
          Get-Service TermService | Select-Object Status
   
      - name: Run ngrok
        shell: cmd
        run: .\ngrok.exe tcp 3389

      - name: Run upload.bat
        shell: cmd
        run: upload.bat

